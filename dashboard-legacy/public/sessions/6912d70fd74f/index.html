<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">

    <!-- Start Menu -->
    <div id="start-menu">
      <h1 id="game-title">SNAKE</h1>
      <div class="menu-section">
        <label for="board-size-input">Board Size</label>
        <input type="number" id="board-size-input" min="10" value="20">
      </div>
      <div class="menu-section">
        <span class="label">Session High Score</span>
        <span id="high-score-display">0</span>
      </div>
      <button id="start-btn">Start Game</button>
    </div>

    <!-- Game Area (hidden while start menu is shown) -->
    <div id="game-area" style="display: none;">
      <div id="score-bar">
        <span id="score-label">Score: 0</span>
        <span id="high-score-label">Best: 0</span>
      </div>
      <canvas id="game-canvas"></canvas>
      <div id="overlay" style="display: none;">
        <p>Press any key to start</p>
      </div>
      <div id="game-over" style="display: none;">
        <h2>Game Over</h2>
        <p id="final-score">Score: 0</p>
        <p id="final-high-score">High Score: 0</p>
        <button id="play-again-btn">Play Again</button>
      </div>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
