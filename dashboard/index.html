<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Interview — Agent Generation Showcase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the persisted/system theme before first paint to avoid a flash
      // of the wrong theme. Must match STORAGE_KEY in src/lib/theme.ts.
      document.documentElement.dataset.theme =
        localStorage.getItem('llm-interview-theme') ??
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
