<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browser OS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===== Desktop (carries the current wallpaper, ticket 2) ===== -->
  <div id="desktop" class="desktop wallpaper" aria-label="Desktop">
    <!-- Desktop icons: visual placeholders; window manager arrives with ticket 1 -->
    <div id="desktop-icons" class="desktop-icons" aria-label="Desktop icons">
      <button class="desktop-icon" type="button" data-app="notepad" title="Notepad">
        <span class="icon" aria-hidden="true">📝</span>
        <span class="icon-label">Notepad</span>
      </button>
      <button class="desktop-icon" type="button" data-app="calculator" title="Calculator">
        <span class="icon" aria-hidden="true">🧮</span>
        <span class="icon-label">Calculator</span>
      </button>
      <button class="desktop-icon" type="button" data-app="minesweeper" title="Minesweeper">
        <span class="icon" aria-hidden="true">💣</span>
        <span class="icon-label">Minesweeper</span>
      </button>
      <button class="desktop-icon" type="button" data-app="spider" title="Spider Solitaire">
        <span class="icon" aria-hidden="true">🕸️</span>
        <span class="icon-label">Spider Solitaire</span>
      </button>
    </div>
  </div>

  <!-- ===== Context menu (ticket 2) ===== -->
  <div id="context-menu" class="context-menu" role="menu" aria-label="Desktop menu" hidden>
    <button class="context-menu-item" type="button" role="menuitem" data-action="change-wallpaper">
      Change wallpaper
    </button>
  </div>

  <!-- ===== Wallpaper preset picker (ticket 2) ===== -->
  <div id="wallpaper-picker" class="picker" hidden>
    <div class="picker-panel" role="dialog" aria-modal="true" aria-labelledby="picker-title">
      <div class="picker-header">
        <h2 id="picker-title">Change wallpaper</h2>
        <button id="picker-close" class="picker-close" type="button" aria-label="Close wallpaper picker">✕</button>
      </div>
      <div id="picker-grid" class="picker-grid"></div>
    </div>
  </div>

  <!-- ===== Taskbar (shell foundation) ===== -->
  <footer id="taskbar" class="taskbar">
    <div id="taskbar-buttons" class="taskbar-buttons" aria-label="Open windows"></div>
    <div id="clock" class="clock" aria-label="Clock">--:--</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
