<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>City Time Machine — a tiny looping world</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 3D canvas is injected here by script.js -->
  <div id="stage" aria-label="3D diorama of a cozy city block"></div>

  <!-- UI overlay -->
  <header id="hud">
    <h1>City Time Machine</h1>
    <p>
      A tiny looping city, always 9&nbsp;PM, always warm.
      <span class="hint">drag to orbit · scroll to zoom</span>
    </p>
  </header>

  <nav id="dock" aria-label="Companion controls">
    <button id="soundBtn" type="button" aria-pressed="true" aria-label="Toggle lo-fi soundtrack">
      <span class="dot" aria-hidden="true"></span><span id="soundLabel">sound&nbsp;on</span>
    </button>
    <button id="spinBtn" type="button" aria-pressed="true" aria-label="Toggle slow auto-orbit">
      <span class="dot" aria-hidden="true"></span><span>auto&nbsp;spin</span>
    </button>
    <button id="resetBtn" type="button" aria-label="Reset camera">
      <span class="dot" aria-hidden="true"></span><span>reset&nbsp;view</span>
    </button>
  </nav>

  <!-- First-visit nudge: browsers block audio until a gesture -->
  <div id="nudge" hidden>
    <p>tap to start the night</p>
  </div>

  <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
  <script src="script.js"></script>
</body>
</html>
