<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Desktop area -->
  <div id="desktop">
    <!-- Desktop icons -->
    <div id="desktop-icons">
      <div class="desktop-icon" data-app="notepad" title="Notepad">
        <svg class="desktop-icon-svg" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <rect x="8" y="4" width="32" height="40" rx="3" fill="#4A90D9" stroke="#357ABD" stroke-width="1.5"/>
          <line x1="14" y1="14" x2="34" y2="14" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="14" y1="20" x2="34" y2="20" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="14" y1="26" x2="28" y2="26" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span class="desktop-icon-label">Notepad</span>
      </div>
      <div class="desktop-icon" data-app="calculator" title="Calculator">
        <svg class="desktop-icon-svg" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <rect x="10" y="4" width="28" height="40" rx="4" fill="#6B7280" stroke="#4B5563" stroke-width="1.5"/>
          <rect x="14" y="8" width="20" height="10" rx="2" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="1"/>
          <circle cx="17" cy="24" r="2" fill="#9CA3AF"/>
          <circle cx="24" cy="24" r="2" fill="#9CA3AF"/>
          <circle cx="31" cy="24" r="2" fill="#9CA3AF"/>
          <circle cx="17" cy="32" r="2" fill="#9CA3AF"/>
          <circle cx="24" cy="32" r="2" fill="#9CA3AF"/>
          <circle cx="31" cy="32" r="2" fill="#9CA3AF"/>
          <circle cx="17" cy="40" r="2" fill="#9CA3AF"/>
          <circle cx="24" cy="40" r="2" fill="#9CA3AF"/>
          <circle cx="31" cy="40" r="2" fill="#F59E0B"/>
        </svg>
        <span class="desktop-icon-label">Calculator</span>
      </div>
      <div class="desktop-icon" data-app="minesweeper" title="Minesweeper">
        <svg class="desktop-icon-svg" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <rect x="6" y="6" width="36" height="36" rx="3" fill="#9CA3AF" stroke="#6B7280" stroke-width="1.5"/>
          <circle cx="24" cy="24" r="8" fill="#374151"/>
          <line x1="24" y1="12" x2="24" y2="16" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="24" y1="32" x2="24" y2="36" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="12" y1="24" x2="16" y2="24" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="32" y1="24" x2="36" y2="24" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="15.5" y1="15.5" x2="18.3" y2="18.3" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="29.7" y1="29.7" x2="32.5" y2="32.5" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="32.5" y1="15.5" x2="29.7" y2="18.3" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="18.3" y1="29.7" x2="15.5" y2="32.5" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span class="desktop-icon-label">Minesweeper</span>
      </div>
      <div class="desktop-icon" data-app="spider" title="Spider Solitaire">
        <svg class="desktop-icon-svg" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <rect x="8" y="6" width="18" height="34" rx="2" fill="#1F6B3A" stroke="#165230" stroke-width="1.5"/>
          <rect x="14" y="8" width="18" height="34" rx="2" fill="#1F6B3A" stroke="#165230" stroke-width="1.5"/>
          <rect x="20" y="10" width="18" height="34" rx="2" fill="#1F6B3A" stroke="#165230" stroke-width="1.5"/>
          <rect x="26" y="12" width="18" height="34" rx="2" fill="white" stroke="#D1D5DB" stroke-width="1.5"/>
          <text x="35" y="34" font-size="14" text-anchor="middle" fill="#1F6B3A" font-family="serif">♠</text>
        </svg>
        <span class="desktop-icon-label">Spider Solitaire</span>
      </div>
    </div>

    <!-- Windows container -->
    <div id="windows-container"></div>

    <!-- Context menu -->
    <div id="context-menu" class="context-menu hidden">
      <div id="context-menu-content"></div>
    </div>
  </div>

  <!-- Taskbar -->
  <div id="taskbar">
    <div id="taskbar-buttons"></div>
    <div id="taskbar-clock"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
