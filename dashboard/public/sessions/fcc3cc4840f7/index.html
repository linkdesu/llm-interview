<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cozy City Block — Time Machine Diorama</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app"></div>

  <!-- Loading / start overlay -->
  <div id="start-overlay" class="overlay">
    <div class="start-card">
      <div class="start-title">City Time Machine</div>
      <div class="start-sub">A cozy little block, frozen in golden hour</div>
      <button id="start-btn" class="btn-primary">Enter the Diorama</button>
      <div class="start-hint">Drag to orbit · Scroll to zoom · Click objects to learn</div>
    </div>
  </div>

  <!-- HUD -->
  <header id="hud" class="hud hidden">
    <div class="hud-left">
      <span class="logo">◈ City Time Machine</span>
      <span id="time-badge" class="time-badge">Golden Hour · 17:42</span>
    </div>
    <div class="hud-right">
      <!-- Audio toggles -->
      <div class="control-group">
        <button id="music-btn" class="ctrl-btn" @uid="music-btn" title="Toggle lo-fi music">
          <span class="icon">♪</span><span class="label">Music</span>
        </button>
        <button id="amb-btn" class="ctrl-btn" @uid="amb-btn" title="Toggle ambient sounds">
          <span class="icon">🌙</span><span class="label">Ambience</span>
        </button>
      </div>
      <!-- Time of day -->
      <div class="control-group">
        <button id="time-btn" class="ctrl-btn" @uid="time-btn" title="Cycle time of day">
          <span class="icon">☀</span><span class="label">Time</span>
        </button>
      </div>
      <!-- Reset camera -->
      <button id="reset-btn" class="ctrl-btn" @uid="reset-btn" title="Reset camera view">
        <span class="icon">⌂</span><span class="label">Reset</span>
      </button>
    </div>
  </header>

  <!-- Info card (appears when clicking an object) -->
  <aside id="info-card" class="info-card hidden">
    <button id="info-close" class="info-close" @uid="info-close" title="Close">×</button>
    <div class="info-icon" @uid="info-icon">🏪</div>
    <h2 id="info-title" class="info-title">Storefront</h2>
    <p id="info-desc" class="info-desc">A cozy little shop.</p>
  </aside>

  <!-- Legend / controls help -->
  <footer id="legend" class="legend hidden">
    <div class="legend-item"><span class="kbd">Drag</span> Orbit</div>
    <div class="legend-item"><span class="kbd">Scroll</span> Zoom</div>
    <div class="legend-item"><span class="kbd">Click</span> Inspect</div>
    <div class="legend-item"><span class="kbd">Tab</span> Next object</div>
  </footer>

  <!-- Loading progress -->
  <div id="loader" class="loader hidden">
    <div class="spinner"></div>
    <div id="load-text">Building the block…</div>
  </div>

  <!-- Three.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
